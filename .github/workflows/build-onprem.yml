name: Build and Publish On-Prem SCION

on:
  push:
    branches: [teyfix/onprem]
  workflow_dispatch:
    inputs:
      fork_ref:
        description: 'teyfix/scion branch, tag, or commit to build'
        required: true
        default: 'teyfix/onprem'
        type: string
      version_tag:
        description: 'Human image tag; blank defaults to onprem-<6-char fork SHA>'
        required: false
        default: ''
        type: string
      publish_latest:
        description: 'Also update the latest tag on every image'
        required: true
        default: false
        type: boolean
      build_scope:
        description: 'Feature artifacts, or the complete stock image catalog'
        required: true
        default: feature
        type: choice
        options:
          - feature
          - all

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-onprem-scion
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/teyfix
  SOURCE: https://github.com/teyfix/scion

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      version_tag: ${{ steps.source.outputs.version_tag }}
      build_tag: ${{ steps.source.outputs.build_tag }}
      build_scope: ${{ steps.source.outputs.build_scope }}
      harnesses: ${{ steps.source.outputs.harnesses }}
    steps:
      - name: Checkout selected fork revision
        uses: actions/checkout@v7
        with:
          repository: teyfix/scion
          ref: ${{ inputs.fork_ref || github.sha }}
          persist-credentials: false
      - name: Resolve source, tags, and harness matrix
        id: source
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'feature' }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          VERSION_TAG="${VERSION_TAG:-onprem-${commit_sha:0:6}}"
          if [[ "${BUILD_SCOPE}" != feature && "${BUILD_SCOPE}" != all ]]; then
            echo '::error::build_scope must be feature or all'
            exit 1
          fi
          if [[ ! "${VERSION_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo '::error::version_tag is not a valid image tag'
            exit 1
          fi
          # Reserve aliases so a human tag cannot impersonate another commit
          # or update latest when publish_latest is false.
          if [[ "${VERSION_TAG}" == latest || "${VERSION_TAG}" == sha-* || "${VERSION_TAG}" == build-* ]]; then
            echo '::error::version_tag must not be latest or start with sha- or build-'
            exit 1
          fi
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export IMAGE_BUILD_DIR="${REPO_ROOT}/image-build"
          source image-build/scripts/lib/targets.sh
          harnesses="$(resolve_targets harnesses | jq -Rsc 'split("\n") | map(select(length > 0))')"
          test "$(jq 'length' <<< "${harnesses}")" -gt 0
          {
            echo "commit_sha=${commit_sha}"
            echo "short_sha=${short_sha}"
            echo "version_tag=${VERSION_TAG}"
            echo "build_tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "build_scope=${BUILD_SCOPE}"
            echo "harnesses=${harnesses}"
          } >> "${GITHUB_OUTPUT}"

  # Bases are serial dependencies. Push them before a different runner builds
  # a child image.
  bases:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
      SCION_GHA_CACHE_SCOPE_PREFIX: onprem
    steps:
      - uses: actions/checkout@v7
        with:
          repository: teyfix/scion
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Inline buildx commands need the runner's ephemeral cache credentials.
      - name: Enable GitHub Actions cache access
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build core base, then Scion base
        run: |
          set -euo pipefail
          for target in core-base scion-base; do
            bash image-build/scripts/build-images.sh \
              --builder local-docker --registry "${REGISTRY}" \
              --target "${target}" --tag "${BUILD_TAG}" \
              --platform linux/amd64 --push
          done
          # The existing script also emits short-SHA tags. Human/full-SHA
          # aliases and index metadata are applied after all jobs succeed.
      - name: Verify base binary contract
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh \
            "${REGISTRY}/scion-base:${BUILD_TAG}" -ec \
            '/usr/local/bin/scion version; /usr/local/bin/sciontool version'

  harnesses:
    needs: [prepare, bases]
    if: needs.prepare.outputs.build_scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.harnesses) }}
    env:
      IMAGE: ${{ matrix.image }}
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: teyfix/scion
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable GitHub Actions cache access
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build catalog harness for linux/amd64
        run: |
          set -euo pipefail
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export IMAGE_BUILD_DIR="${REPO_ROOT}/image-build"
          export BASE_TAG="${BUILD_TAG}"
          source image-build/scripts/lib/targets.sh
          is_harness_step "${IMAGE}"
          build_args=()
          while IFS= read -r arg; do
            [[ -z "${arg}" ]] || build_args+=(--build-arg "${arg}")
          done < <(step_build_args "${IMAGE}")
          docker buildx build --platform linux/amd64 \
            --file "$(step_dockerfile "${IMAGE}")" \
            "${build_args[@]}" \
            --cache-from "type=gha,version=2,scope=onprem-${IMAGE}" \
            --cache-to "type=gha,version=2,scope=onprem-${IMAGE},mode=max" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.version=${VERSION_TAG}" \
            --tag "${REGISTRY}/${IMAGE}:${BUILD_TAG}" \
            --push "$(step_context_dir "${IMAGE}")"

  # Independent of tool images: root Dockerfile builds the frontend and embeds
  # it into scion. Never build image-build/hub's no_embed_web variant here.
  hub:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: teyfix/scion
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable GitHub Actions cache access
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build Hub with embedded dashboard
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --file Dockerfile \
            --cache-from type=gha,version=2,scope=onprem-scion-hub \
            --cache-to type=gha,version=2,scope=onprem-scion-hub,mode=max \
            --build-arg "GIT_COMMIT=${COMMIT_SHA}" \
            --build-arg "VERSION=${VERSION_TAG}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.version=${VERSION_TAG}" \
            --tag "${REGISTRY}/scion-hub:${BUILD_TAG}" --push .
      - name: Verify dashboard is served on linux/amd64
        run: |
          set -euo pipefail
          container="$(docker run -d --platform linux/amd64 \
            -p 127.0.0.1:18080:8080 "${REGISTRY}/scion-hub:${BUILD_TAG}" \
            server start --foreground --hosted --enable-hub --enable-web \
            --enable-runtime-broker=false --host 0.0.0.0 --web-port 8080)"
          trap 'docker logs "${container}"; docker rm -f "${container}"' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 10 \
            http://127.0.0.1:18080/healthz > /dev/null
          curl --fail --silent --show-error \
            --output "${RUNNER_TEMP}/dashboard.html" \
            http://127.0.0.1:18080/login
          grep -q '/assets/main.js' "${RUNNER_TEMP}/dashboard.html"
          # Missing assets may fall back to HTML: verify MIME and body too.
          curl --fail --silent --show-error \
            --dump-header "${RUNNER_TEMP}/dashboard.headers" \
            --output "${RUNNER_TEMP}/dashboard.js" \
            http://127.0.0.1:18080/assets/main.js
          grep -Eiq '^content-type:.*(javascript|ecmascript)' "${RUNNER_TEMP}/dashboard.headers"
          test -s "${RUNNER_TEMP}/dashboard.js"
          docker rm -f "${container}"
          trap - EXIT

  publish:
    needs: [prepare, bases, harnesses, hub]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.bases.result == 'success' &&
      needs.hub.result == 'success' &&
      (needs.harnesses.result == 'success' || needs.harnesses.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      BUILD_SCOPE: ${{ needs.prepare.outputs.build_scope }}
      PUBLISH_LATEST: ${{ inputs.publish_latest || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: teyfix/scion
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote completed images to release tags
        run: |
          set -euo pipefail
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export IMAGE_BUILD_DIR="${REPO_ROOT}/image-build"
          source image-build/scripts/lib/targets.sh
          images=(core-base scion-base scion-hub)
          if [[ "${BUILD_SCOPE}" == all ]]; then
            images=()
            while IFS= read -r image; do
              images+=("${image}")
            done < <(resolve_targets all)
          fi
          for image in "${images[@]}"; do
            tag_args=(
              --tag "${REGISTRY}/${image}:${VERSION_TAG}"
              --tag "${REGISTRY}/${image}:${SHORT_SHA}"
              --tag "${REGISTRY}/${image}:sha-${COMMIT_SHA}"
            )
            if [[ "${PUBLISH_LATEST}" == true ]]; then
              tag_args+=(--tag "${REGISTRY}/${image}:latest")
            fi
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
              --annotation "index:org.opencontainers.image.version=${VERSION_TAG}" \
              "${tag_args[@]}" "${REGISTRY}/${image}:${BUILD_TAG}"
          done
      - name: Publish summary
        run: |
          set -euo pipefail
          {
            echo '## On-Prem SCION images published'
            echo "- Fork commit: ${COMMIT_SHA}"
            echo "- Build scope: ${BUILD_SCOPE}"
            echo "- Tags: ${VERSION_TAG}, ${SHORT_SHA}, sha-${COMMIT_SHA}"
            echo "- Latest updated: ${PUBLISH_LATEST}"
            echo '- Platform: linux/amd64'
            if [[ "${BUILD_SCOPE}" == all ]]; then
              echo '- Images: core-base, scion-base, every catalog harness, scion-hub'
            else
              echo '- Images: core-base, scion-base, scion-hub'
            fi
            echo '- scion-base: /usr/local/bin/scion and /usr/local/bin/sciontool'
            echo '- scion-hub: /usr/local/bin/scion with embedded dashboard (no sciontool)'
            echo '- Hub startup: server start --foreground --hosted --enable-hub --enable-web --host 0.0.0.0'
            echo "- Temporary build tag retained: ${BUILD_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
